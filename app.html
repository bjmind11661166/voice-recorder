<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字起こしレコーダー</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      text-align: center; 
      max-width: 600px;
      margin: 0 auto;
    }
    .mode-selector {
      background: #e8f0fe;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    button { 
      padding: 15px 30px; 
      font-size: 18px; 
      margin: 10px; 
      border-radius: 8px; 
      cursor: pointer;
    }
    #startBtn { background-color: #ff4444; color: white; border: none; }
    #startBtn:disabled { background-color: #ffaaaa; cursor: not-allowed; }
    #stopBtn { background-color: #444444; color: white; border: none; }
    #stopBtn:disabled { background-color: #aaaaaa; cursor: not-allowed; }
    #result { 
      text-align: left; 
      background: #f0f0f0; 
      padding: 15px; 
      border-radius: 8px;
      margin-top: 20px;
      min-height: 100px;
      word-wrap: break-word;
    }
    #status { font-weight: bold; margin: 15px 0; color: #333; }
    .btn-container { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .doc-btn { padding: 10px 20px; background-color: #1a73e8; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .pdf-btn { padding: 10px 20px; background-color: #ea4335; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🎙️ 音声アシスタント</h2>

  <!-- モード選択エリア -->
  <div class="mode-selector">
    <label style="margin-right: 15px; cursor: pointer;">
      <input type="radio" name="mode" value="short" checked> ⚡ 短時間モード（画面に結果表示＋PDF）
    </label>
    <label style="cursor: pointer;">
      <input type="radio" name="mode" value="long"> 🕒 長時間モード（裏側で処理＆ドキュメント自動作成）
    </label>
  </div>

  <button id="startBtn">録音開始</button>
  <button id="stopBtn" disabled>録音停止</button>
  <p id="status">待機中...</p>
  <div id="result">ここに結果が表示されます</div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let mimeType = 'audio/webm'; 
    const gasUrl = "https://script.google.com/macros/s/AKfycbyi6zq9LrstzjDYwkOMHpZoopXDdZMAPOhKtHruIKtt5P5nHgd02yvgJpLyPBPbvOoX/exec"; 

    // ステータスを定期的に確認する関数（ポーリング）
    function startPollingStatus(jobId) {
      const pollingTimer = setInterval(() => {
        fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'checkStatus', jobId: jobId })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'done') {
            clearInterval(pollingTimer); // 確認ループを終了
            
            document.getElementById('status').innerText = "✅ 解析完了！ドキュメントとPDFを作成しました。";
            
            const formattedText = data.text.replace(/\n/g, '<br>');
            const buttonsHtml = `
              <div class="btn-container">
                <a href="${data.docUrl}" target="_blank" class="doc-btn">📄 ドキュメントを開く</a>
                <a href="${data.pdfUrl}" target="_blank" class="pdf-btn">📕 PDFを開く</a>
              </div>
              <hr>
            `;
            document.getElementById('result').innerHTML = buttonsHtml + formattedText;

          } else if (data.status === 'error') {
            clearInterval(pollingTimer); // 確認ループを終了
            document.getElementById('status').innerText = "❌ 解析中にエラーが発生しました。";
            document.getElementById('result').innerHTML = `<p style="color:red;">${data.error}</p>`;
          }
          // status が 'processing' の場合は、次回(10秒後)の確認を待つ
        })
        .catch(err => console.error("ステータス確認エラー:", err));
      }, 10000); // 10秒ごとに確認
    }


    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        if (MediaRecorder.isTypeSupported('audio/webm')) {
            mimeType = 'audio/webm';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4'; 
        } else {
            mimeType = ''; 
        }

        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const selectedMode = document.querySelector('input[name="mode"]:checked').value;
          
          if (selectedMode === 'short') {
            document.getElementById('status').innerText = "⏳ 解析中...（画面を閉じずにお待ちください）";
          } else {
            document.getElementById('status').innerText = "⏳ 音声データを送信中...";
          }

          const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/mp4' });
          
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = () => {
            const base64Data = reader.result;
            
            const payload = { 
              base64Data: base64Data, 
              mimeType: mimeType || 'audio/mp4',
              mode: selectedMode
            };

            fetch(gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' }, 
              body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
              if (data.success) {
                if (selectedMode === 'short') {
                  // 短時間モード：即座に完了
                  document.getElementById('status').innerText = "✅ 解析完了！ドキュメントとPDFを作成しました。";
                  const formattedText = data.text.replace(/\n/g, '<br>');
                  const buttonsHtml = `
                    <div class="btn-container">
                      <a href="${data.docUrl}" target="_blank" class="doc-btn">📄 ドキュメントを開く</a>
                      <a href="${data.pdfUrl}" target="_blank" class="pdf-btn">📕 PDFを開く</a>
                    </div>
                    <hr>
                  `;
                  document.getElementById('result').innerHTML = buttonsHtml + formattedText;

                } else {
                  // 長時間モード：受付完了後、ステータス確認ループを開始
                  document.getElementById('status').innerText = "⏳ サーバーで解析中...（この画面を開いたままお待ちください。数分かかる場合があります）";
                  document.getElementById('result').innerHTML = `
                    <p><strong>${data.text.replace(/\n/g, '<br>')}</strong></p>
                  `;
                  
                  // ジョブIDを使って定期確認を開始
                  startPollingStatus(data.jobId);
                }
              } else {
                document.getElementById('status').innerText = "GAS側エラー: " + data.error;
              }
            })
            .catch(err => {
              document.getElementById('status').innerText = "通信エラー: " + err.message;
            });
          };
        };

        mediaRecorder.start();
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('status').innerText = "🔴 録音中...";

      } catch (err) {
        alert("マイク接続エラー\n" + err.name + ": " + err.message);
        document.getElementById('status').innerText = "エラー: " + err.name;
      }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    });
  </script>
</body>
</html>
